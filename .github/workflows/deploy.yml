name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg && pip install pillow python-docx
      - name: Build
        # Default: project page at https://<owner>.github.io/<repo>/.
        # With a custom domain, set repository variable SITE_URL (e.g. https://khaledhammad.com);
        # BASE_PATH then defaults to empty (override with the BASE_PATH variable if needed).
        run: |
          if [ -n "${{ vars.SITE_URL }}" ]; then
            export SITE_URL="${{ vars.SITE_URL }}" BASE_PATH="${{ vars.BASE_PATH }}"
          else
            export SITE_URL="https://${{ github.repository_owner }}.github.io" BASE_PATH="/${{ github.event.repository.name }}"
          fi
          python3 tools/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
